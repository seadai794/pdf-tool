<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>证件照制作 · 跳过背景涂抹</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #eef1f6; color: #0f172a; min-height: 100vh; }
  .app-header { max-width: 600px; margin: 0 auto 16px; background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff; padding: 22px 20px; border-radius: 16px; text-align: center;
    box-shadow: 0 6px 20px rgba(37,99,235,.3); }
  .app-header h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: .8px; }
  .app-header .sub { margin: 6px 0 0; font-size: 12px; opacity: .9; }
  .container { max-width: 600px; margin: 0 auto; }
  .card { background: #fff; border-radius: 14px; padding: 18px 20px; margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.06);
    border: 1px solid #f1f5f9; }
  .card h2 { margin: 0 0 14px; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; gap: 8px; }
  .step-label { display: inline-flex; align-items: center; justify-content: center;
    padding: 4px 10px; background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff;
    border-radius: 7px; font-size: 11px; font-weight: 700; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: #475569; margin-bottom: 5px; font-weight: 500; }
  select, input[type=file] { width: 100%; padding: 12px; border: 1.5px solid #e2e8f0;
    border-radius: 9px; background: #fff; color: #0f172a; font-size: 16px; font-family: inherit;
    min-height: 48px; }
  select:focus, input[type=file]:focus { outline: none; border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  input[type=file] { padding: 10px; border-style: dashed; background: #f8fafc; cursor: pointer; }
  .btn { display: inline-flex; align-items: center; justify-content: center;
    padding: 12px 18px; border: none; border-radius: 10px; background: linear-gradient(135deg, #2563eb, #3b82f6);
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
    box-shadow: 0 2px 6px rgba(37,99,235,.25); transition: all .15s; min-height: 44px; }
  .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,.35); }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
  .btn.green { background: linear-gradient(135deg, #059669, #10b981); box-shadow: 0 2px 6px rgba(5,150,105,.25); }
  .btn.gray { background: #f1f5f9; color: #334155; box-shadow: none; border: 1px solid #e2e8f0; }
  .btn.purple { background: linear-gradient(135deg, #7c3aed, #a855f7); box-shadow: 0 2px 6px rgba(124,58,237,.25); }
  .btn.big { width: 100%; padding: 14px; font-size: 15px; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .hint { font-size: 11px; color: #64748b; line-height: 1.6; margin: 8px 0 0; }
  .status { font-size: 12px; color: #2563eb; margin-top: 10px; padding: 8px 12px;
    border-radius: 8px; line-height: 1.5; min-height: 18px; }
  .status:not(:empty) { background: #eff6ff; }
  .status.err { color: #dc2626; background: #fef2f2; }
  .status.ok { color: #059669; background: #f0fdf4; }
  .hidden { display: none !important; }
  .idphoto-crop-stage { position: relative; width: 100%; border-radius: 10px; background: #0f172a;
    overflow: hidden; touch-action: pan-y; line-height: 0; margin-top: 10px; }
  .idphoto-crop-stage canvas { display: block; width: 100%; height: auto; touch-action: pan-y; }
  .idphoto-crop-stage canvas.overlay { position: absolute; left: 0; top: 0;
    pointer-events: none; touch-action: none; }
  .preview-wrap { margin-top: 12px; border: 1px solid #e2e8f0; border-radius: 10px;
    background: #1e293b; padding: 12px; text-align: center; }
  .preview-wrap canvas { box-shadow: 0 4px 12px rgba(0,0,0,.5); max-width: 100%; touch-action: none; cursor: grab; }
  .preview-wrap canvas:active { cursor: grabbing; }
  .tag { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 999px;
    background: #e0e7ff; color: #3730a3; font-weight: 600; margin-left: 6px; }
  .skip-badge { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #78350f;
    font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
  @media (max-width: 480px) {
    .app-header { padding: 18px 16px; }
    .app-header h1 { font-size: 19px; }
    .card { padding: 14px 16px; }
  }
</style>
</head>
<body>

<header class="app-header">
  <h1>👤 证件照制作</h1>
  <p class="sub">支持跳过背景涂抹 · 直接生成证件照</p>
</header>

<div class="container">

  <!-- 第 1 步：上传照片 -->
  <div class="card">
    <h2><span class="step-label">第 1 步</span> 上传人像照片</h2>
    <input type="file" id="idphotoFile" accept="image/*" />
    <p class="hint">支持 JPG / PNG。如果照片背景已经是纯色或已处理过，可以<b>跳过涂抹背景</b>。</p>
  </div>

  <!-- 第 2 步：裁剪取景 -->
  <div class="card hidden" id="idphotoCropCard">
    <h2><span class="step-label">第 2 步</span> 裁剪取景区域</h2>
    <p class="hint">拖动虚线框，只框选「头顶到胸口」的区域。</p>
    <div class="idphoto-crop-stage" id="idphotoCropStage">
      <canvas id="idphotoCropCanvas"></canvas>
      <canvas class="overlay" id="idphotoCropOverlay"></canvas>
    </div>
    <div class="btn-row">
      <button class="btn gray" id="idphotoCropReset" type="button">↺ 重置框</button>
      <button class="btn green" id="idphotoCropConfirm" type="button" style="flex:1">✓ 使用此区域</button>
    </div>
    <div class="status" id="idphotoCropStatus"></div>
  </div>

  <!-- 第 3 步：背景处理（可跳过） -->
  <div class="card hidden" id="idphotoBgCard">
    <h2><span class="step-label">第 3 步</span> 背景处理 <span class="tag">可跳过</span></h2>
    <p class="hint" style="margin-bottom:14px">
      如果照片背景已经是纯色（白/蓝/红）或已去除背景，<b>可以直接跳过此步</b>，进入第 4 步。
    </p>
    <div class="btn-row" style="margin-bottom:12px">
      <button class="btn purple" id="idphotoSkipBgBtn" type="button" style="flex:1">
        ⏭️ 跳过涂抹，直接生成
      </button>
      <button class="btn gray" id="idphotoUseBordercutBtn" type="button" style="flex:1">
        ✏️ 涂抹擦除背景
      </button>
    </div>
    <div id="idphotoBordercutArea" class="hidden">
      <div class="idphoto-crop-stage" id="idphotoBordercutStage">
        <canvas id="idphotoBordercutCanvas"></canvas>
      </div>
      <div class="idphoto-crop-stage hidden" id="idphotoBordercutPreviewStage">
        <canvas id="idphotoBordercutPreviewCanvas"></canvas>
      </div>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn gray hidden" id="idphotoBordercutClear" type="button">继续涂抹</button>
        <button class="btn red hidden" id="idphotoBordercutUndo" type="button">撤销</button>
        <button class="btn gray hidden" id="idphotoBordercutReset" type="button">重置</button>
        <button class="btn green" id="idphotoBordercutApply" type="button" style="flex:1">应用涂抹</button>
      </div>
      <button class="btn big purple hidden" id="idphotoBordercutConfirm" type="button" style="margin-top:12px">✅ 满意，继续</button>
      <div class="status" id="idphotoBordercutStatus"></div>
    </div>
    <div class="status" id="idphotoBgStatus"></div>
  </div>

  <!-- 第 4 步：尺寸与排版 -->
  <div class="card hidden" id="idphotoOptCard">
    <h2><span class="step-label">第 4 步</span> 尺寸与排版</h2>
    <div class="field">
      <label>尺寸规格</label>
      <select id="idphotoSize">
        <option value="1inch">一寸 (25 × 35 mm)</option>
        <option value="2inch" selected>二寸 (35 × 49 mm)</option>
        <option value="small1">小一寸 (22 × 32 mm)</option>
        <option value="small2">小二寸 (35 × 45 mm)</option>
      </select>
    </div>
    <div class="field">
      <label>背景颜色</label>
      <select id="idphotoBg">
        <option value="#ffffff">白色</option>
        <option value="#d92b2b" selected>红色</option>
        <option value="#1d4ed8">蓝色</option>
        <option value="#4b5563">灰色</option>
      </select>
    </div>
    <div class="field">
      <label>排版模式</label>
      <select id="idphotoLayout">
        <option value="single">单张导出</option>
        <option value="sheet" selected>相馆排版（5寸相纸拼版）</option>
      </select>
    </div>
    <div class="preview-wrap" id="idphotoPreviewWrap">
      <p class="hint" style="text-align:left;margin:0 0 8px;color:#94a3b8;">
        💡 单张模式下可拖动照片调整位置。
      </p>
      <canvas id="idphotoCanvas"></canvas>
    </div>
    <div class="btn-row">
      <button class="btn green big" id="idphotoDownloadBtn" type="button">💾 保存图片</button>
    </div>
    <div class="status" id="idphotoStatus"></div>
  </div>

</div>

<script>
(function() {
  'use strict';

  // ========== 工具函数 ==========
  const $ = (s) => document.querySelector(s);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

  function say(sel, text, isErr, isOk) {
    const node = typeof sel === 'string' ? $(sel) : sel;
    if (!node) return;
    node.textContent = text || '';
    node.classList.toggle('err', !!isErr);
    node.classList.toggle('ok', !!isOk);
  }

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('图片加载失败'));
      img.src = src;
    });
  }

  function readDataUrl(file) {
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = () => rej(fr.error);
      fr.readAsDataURL(file);
    });
  }

  function drawRotatedCanvas(img, rotation) {
    const rot = ((rotation % 360) + 360) % 360;
    const w = img.naturalWidth || img.width;
    const h = img.naturalHeight || img.height;
    const swap = rot === 90 || rot === 270;
    const cw = swap ? h : w;
    const ch = swap ? w : h;
    const cv = document.createElement('canvas');
    cv.width = cw; cv.height = ch;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, cw, ch);
    ctx.translate(cw / 2, ch / 2);
    ctx.rotate(rot * Math.PI / 180);
    ctx.drawImage(img, -w / 2, -h / 2);
    return cv;
  }

  // ========== 全局变量 ==========
  let idphotoImg = null;          // 原始图片
  let idphotoCropped = null;      // 裁剪后的 canvas
  let idphotoMatted = null;       // 抠图后的 canvas（若有）
  let idphotoMatteMode = 'skip';  // 'skip' = 跳过背景处理，'bordercut' = 涂抹抠图
  let idphotoState = { x: 0, y: 0, dragging: false, startX: 0, startY: 0 };
  let idphotoCtx = null;

  const targetSizes = {
    '1inch':  { w: 295, h: 413 },
    '2inch':  { w: 413, h: 579 },
    'small1': { w: 260, h: 378 },
    'small2': { w: 413, h: 531 }
  };

  // 裁剪框状态
  const crop = {
    viewport: null,
    crop: { x: 0.1, y: 0.05, w: 0.8, h: 0.9 },
    dragMode: null,
    dragStart: null
  };

  // bordercut 相关
  let bordercutStrokes = [];
  let bordercutHistory = [];
  let bordercutSrcCanvas = null;

  // ========== 第 1 步：上传照片 ==========
  $('#idphotoFile').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      idphotoImg = await loadImage(await readDataUrl(f));
      idphotoCropped = null;
      idphotoMatted = null;
      idphotoMatteMode = 'skip';
      idphotoState.x = 0; idphotoState.y = 0;
      crop.crop = { x: 0.1, y: 0.05, w: 0.8, h: 0.9 };
      bordercutHistory = [];
      bordercutStrokes = [];

      // 重置界面
      $('#idphotoCropCard').classList.remove('hidden');
      $('#idphotoBgCard').classList.add('hidden');
      $('#idphotoOptCard').classList.add('hidden');
      $('#idphotoPreviewWrap').classList.add('hidden');
      $('#idphotoBgCard').querySelector('#idphotoBordercutArea').classList.add('hidden');

      requestAnimationFrame(() => {
        requestAnimationFrame(() => { renderCrop(); });
      });
      say('#idphotoCropStatus', '拖动虚线框，框选头顶到胸口的区域');
    } catch (err) {
      say('#idphotoCropStatus', '图片载入失败：' + err.message, true);
    }
  });

  // ========== 第 2 步：裁剪 ==========
  function renderCrop() {
    if (!idphotoImg) return;
    const stage = $('#idphotoCropStage');
    const canvas = $('#idphotoCropCanvas');
    const overlay = $('#idphotoCropOverlay');
    if (!stage || !canvas || !overlay) return;

    const stageW = stage.clientWidth || 320;
    const imgW = idphotoImg.naturalWidth;
    const imgH = idphotoImg.naturalHeight;
    const scale = stageW / imgW;
    const dispW = imgW * scale;
    const dispH = imgH * scale;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    crop.viewport = { width: dispW, height: dispH, dpr };

    [canvas, overlay].forEach((cv) => {
      cv.width = Math.round(dispW * dpr);
      cv.height = Math.round(dispH * dpr);
      cv.style.width = dispW + 'px';
      cv.style.height = dispH + 'px';
    });

    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, dispW, dispH);
    ctx.drawImage(idphotoImg, 0, 0, dispW, dispH);
    drawCropOverlay();
  }

  function drawCropOverlay() {
    const overlay = $('#idphotoCropOverlay');
    const vp = crop.viewport;
    if (!overlay || !vp) return;
    const dpr = vp.dpr;
    const ctx = overlay.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, overlay.width, overlay.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const W = vp.width, H = vp.height;
    const c = crop.crop;
    const cx = c.x * W, cy = c.y * H;
    const cw = c.w * W, ch = c.h * H;

    // 半透明遮罩
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, cy);
    ctx.fillRect(0, cy + ch, W, H - cy - ch);
    ctx.fillRect(0, cy, cx, ch);
    ctx.fillRect(cx + cw, cy, W - cx - cw, ch);

    // 虚线框
    ctx.strokeStyle = '#60a5fa';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 6]);
    ctx.strokeRect(cx, cy, cw, ch);
    ctx.setLineDash([]);

    // 三分线
    ctx.save();
    ctx.strokeStyle = 'rgba(96,165,250,0.35)';
    ctx.lineWidth = 1;
    for (let i = 1; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(cx + cw * i / 3, cy);
      ctx.lineTo(cx + cw * i / 3, cy + ch);
      ctx.moveTo(cx, cy + ch * i / 3);
      ctx.lineTo(cx + cw, cy + ch * i / 3);
      ctx.stroke();
    }
    ctx.restore();

    // 控制点
    const HIT = isMobile ? 22 : 16;
    const pts = [
      [cx, cy], [cx + cw / 2, cy], [cx + cw, cy],
      [cx, cy + ch / 2], [cx + cw, cy + ch / 2],
      [cx, cy + ch], [cx + cw / 2, cy + ch], [cx + cw, cy + ch]
    ];
    pts.forEach(([x, y]) => {
      ctx.beginPath();
      ctx.rect(x - HIT / 2, y - HIT / 2, HIT, HIT);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.strokeStyle = '#2563eb';
      ctx.lineWidth = 2;
      ctx.stroke();
    });

    // 比例提示
    const ratio = (cw / ch).toFixed(2);
    const text = '比例 ' + ratio + ' · 拖边框调整';
    ctx.font = '600 12px -apple-system,"PingFang SC",sans-serif';
    ctx.fillStyle = 'rgba(37,99,235,0.92)';
    const tw = ctx.measureText(text).width + 14;
    ctx.fillRect(cx + 4, cy + 4, tw, 22);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, cx + 11, cy + 16);
  }

  function hitTestCrop(px, py) {
    const vp = crop.viewport;
    if (!vp) return null;
    const W = vp.width, H = vp.height;
    const c = crop.crop;
    const cx = c.x * W, cy = c.y * H;
    const cw = c.w * W, ch = c.h * H;
    const hr = isMobile ? 28 : 20;
    const corners = [
      [cx, cy, 'nw'], [cx + cw, cy, 'ne'],
      [cx, cy + ch, 'sw'], [cx + cw, cy + ch, 'se']
    ];
    for (const [hx, hy, mode] of corners) {
      if (Math.hypot(px - hx, py - hy) < hr) return mode;
    }
    if (Math.abs(py - cy) < hr && px > cx && px < cx + cw) return 'n';
    if (Math.abs(py - (cy + ch)) < hr && px > cx && px < cx + cw) return 's';
    if (Math.abs(px - cx) < hr && py > cy && py < cy + ch) return 'w';
    if (Math.abs(px - (cx + cw)) < hr && py > cy && py < cy + ch) return 'e';
    if (px > cx && px < cx + cw && py > cy && py < cy + ch) return 'move';
    return null;
  }

  (function bindCropDrag() {
    const stage = $('#idphotoCropStage');
    if (!stage) return;
    const getPos = (e) => {
      const rect = stage.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top, w: rect.width, h: rect.height };
    };
    stage.addEventListener('pointerdown', (e) => {
      if (!crop.viewport) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      const p = getPos(e);
      const mode = hitTestCrop(p.x, p.y);
      if (!mode) return;
      const c = crop.crop;
      crop.dragMode = mode;
      crop.dragStart = { px: p.x, py: p.y, W: p.w, H: p.h, x: c.x, y: c.y, w: c.w, h: c.h };
      try { stage.setPointerCapture(e.pointerId); } catch (_) {}
      e.preventDefault();
    }, { passive: false });
    stage.addEventListener('pointermove', (e) => {
      if (!crop.dragMode || !crop.dragStart) return;
      const p = getPos(e);
      const s = crop.dragStart;
      const dx = (p.x - s.px) / s.W;
      const dy = (p.y - s.py) / s.H;
      const mode = crop.dragMode;
      const MIN = 0.08;
      let x = s.x, y = s.y, w = s.w, h = s.h;
      if (mode === 'move') {
        x = clamp(s.x + dx, 0, 1 - s.w);
        y = clamp(s.y + dy, 0, 1 - s.h);
      } else {
        if (mode.includes('w')) {
          const nx = clamp(s.x + dx, 0, s.x + s.w - MIN);
          w = s.x + s.w - nx;
          x = nx;
        }
        if (mode.includes('e')) w = clamp(s.w + dx, MIN, 1 - s.x);
        if (mode.includes('n')) {
          const ny = clamp(s.y + dy, 0, s.y + s.h - MIN);
          h = s.y + s.h - ny;
          y = ny;
        }
        if (mode.includes('s')) h = clamp(s.h + dy, MIN, 1 - s.y);
      }
      crop.crop = { x, y, w, h };
      drawCropOverlay();
      e.preventDefault();
    }, { passive: false });
    function endDrag(e) {
      if (!crop.dragMode) return;
      crop.dragMode = null;
      crop.dragStart = null;
      if (e && e.pointerId !== undefined) {
        try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
      }
    }
    stage.addEventListener('pointerup', endDrag);
    stage.addEventListener('pointercancel', endDrag);
    stage.addEventListener('lostpointercapture', endDrag);
    stage.addEventListener('contextmenu', (e) => e.preventDefault());
  })();

  $('#idphotoCropReset').addEventListener('click', () => {
    crop.crop = { x: 0.1, y: 0.05, w: 0.8, h: 0.9 };
    drawCropOverlay();
    say('#idphotoCropStatus', '已重置为居中区域');
  });

  $('#idphotoCropConfirm').addEventListener('click', async () => {
    if (!idphotoImg) return;
    const c = crop.crop;
    const iw = idphotoImg.naturalWidth;
    const ih = idphotoImg.naturalHeight;
    const sx = Math.round(c.x * iw);
    const sy = Math.round(c.y * ih);
    const sw = Math.max(1, Math.round(c.w * iw));
    const sh = Math.max(1, Math.round(c.h * ih));
    const MAX_DIM = 1024;
    const outW = Math.min(sw, MAX_DIM);
    const outH = Math.round(sh * (outW / sw));
    const cv = document.createElement('canvas');
    cv.width = outW;
    cv.height = outH;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, outW, outH);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(idphotoImg, sx, sy, sw, sh, 0, 0, outW, outH);

    idphotoCropped = cv;
    idphotoMatted = null;
    idphotoState.x = 0; idphotoState.y = 0;
    bordercutSrcCanvas = cv;
    bordercutStrokes = [];
    bordercutHistory = [];

    // 切换到第 3 步
    $('#idphotoCropCard').classList.add('hidden');
    $('#idphotoBgCard').classList.remove('hidden');
    $('#idphotoOptCard').classList.add('hidden');
    $('#idphotoPreviewWrap').classList.add('hidden');
    $('#idphotoBgCard').querySelector('#idphotoBordercutArea').classList.add('hidden');
    $('#idphotoBgStatus').textContent = '';

    say('#idphotoBgStatus', '✅ 裁剪完成！如果背景已经处理过，可直接跳过涂抹。');
  });

  // ========== 第 3 步：背景处理（可跳过） ==========

  // 跳过涂抹 → 直接进入第 4 步
  $('#idphotoSkipBgBtn').addEventListener('click', async () => {
    if (!idphotoCropped) {
      say('#idphotoBgStatus', '请先完成第 2 步的裁剪', true);
      return;
    }
    idphotoMatteMode = 'skip';
    idphotoMatted = null;
    await goToOptions();
  });

  // 使用 bordercut 涂抹
  $('#idphotoUseBordercutBtn').addEventListener('click', () => {
    if (!idphotoCropped) {
      say('#idphotoBgStatus', '请先完成第 2 步的裁剪', true);
      return;
    }
    idphotoMatteMode = 'bordercut';
    $('#idphotoBgCard').querySelector('#idphotoBordercutArea').classList.remove('hidden');
    // 隐藏跳过按钮区域，避免混淆
    $('#idphotoSkipBgBtn').style.display = 'none';
    $('#idphotoUseBordercutBtn').style.display = 'none';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        renderBordercutCanvas(idphotoCropped);
      });
    });
    say('#idphotoBordercutStatus', '用手指在图上涂抹要去掉的背景，涂完点「应用涂抹」');
  });

  function renderBordercutCanvas(srcCanvas) {
    const stage = $('#idphotoBordercutStage');
    const canvas = $('#idphotoBordercutCanvas');
    if (!stage || !canvas) return;

    const stageW = stage.clientWidth || 320;
    const scale = stageW / srcCanvas.width;
    const dispW = Math.round(srcCanvas.width * scale);
    const dispH = Math.round(srcCanvas.height * scale);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.round(dispW * dpr);
    canvas.height = Math.round(dispH * dpr);
    canvas.style.width = dispW + 'px';
    canvas.style.height = dispH + 'px';

    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, dispW, dispH);
    ctx.drawImage(srcCanvas, 0, 0, dispW, dispH);

    bordercutStrokes = [];
    $('#idphotoBordercutStage').classList.remove('hidden');
    $('#idphotoBordercutPreviewStage').classList.add('hidden');
    $('#idphotoBordercutApply').classList.remove('hidden');
    $('#idphotoBordercutConfirm').classList.add('hidden');
    updateBordercutButtons();
    say('#idphotoBordercutStatus', '继续涂抹剩余要去掉的背景区域');
  }

  function updateBordercutButtons() {
    const hasHistory = bordercutHistory.length > 0;
    $('#idphotoBordercutUndo').classList.toggle('hidden', !hasHistory);
    $('#idphotoBordercutReset').classList.toggle('hidden', !(hasHistory || idphotoMatted));
    $('#idphotoBordercutClear').classList.toggle('hidden', !idphotoMatted);
  }

  // bordercut 涂抹绘制（简化：仅记录轨迹）
  (function bindBordercutDraw() {
    const canvas = $('#idphotoBordercutCanvas');
    if (!canvas) return;
    let isDrawing = false;
    let startX = 0, startY = 0;

    const getPos = (e) => {
      const rect = canvas.getBoundingClientRect();
      let x = (e.clientX - rect.left) / rect.width;
      let y = (e.clientY - rect.top) / rect.height;
      return {
        x: Math.max(0, Math.min(1, x)),
        y: Math.max(0, Math.min(1, y))
      };
    };

    canvas.addEventListener('pointerdown', (e) => {
      if (!bordercutSrcCanvas) return;
      startX = e.clientX;
      startY = e.clientY;
      isDrawing = false;
      // 只在水平滑动时开始绘制，避免与垂直滚动冲突
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!bordercutSrcCanvas) return;
      if (!e.buttons) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (!isDrawing) {
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 5) {
          isDrawing = true;
          const p = getPos({ clientX: startX, clientY: startY });
          bordercutStrokes.push(p);
          drawMark(canvas, p);
          try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
        } else if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 5) {
          return; // 垂直滑动，不绘制
        }
      }
      if (isDrawing) {
        const p = getPos(e);
        bordercutStrokes.push(p);
        drawMark(canvas, p);
        e.preventDefault();
      }
    }, { passive: false });

    function endDraw(e) {
      isDrawing = false;
      try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
    }
    canvas.addEventListener('pointerup', endDraw);
    canvas.addEventListener('pointercancel', endDraw);
  })();

  function drawMark(canvas, p) {
    const ctx = canvas.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    const x = p.x * rect.width;
    const y = p.y * rect.height;
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.beginPath();
    ctx.arc(x, y, 8, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(239, 68, 68, 0.5)';
    ctx.fill();
    ctx.restore();
  }

  $('#idphotoBordercutClear').addEventListener('click', () => {
    if (!bordercutSrcCanvas) return;
    if (idphotoMatted && idphotoMatted.mode === 'bordercut') {
      bordercutSrcCanvas = idphotoMatted.canvas;
    }
    bordercutStrokes = [];
    renderBordercutCanvas(bordercutSrcCanvas);
  });

  $('#idphotoBordercutUndo').addEventListener('click', () => {
    if (bordercutHistory.length === 0) return;
    const last = bordercutHistory.pop();
    bordercutSrcCanvas = last.canvas;
    idphotoMatted = bordercutHistory.length > 0 ? { canvas: last.canvas, mode: 'bordercut' } : null;
    renderBordercutCanvas(bordercutSrcCanvas);
    say('#idphotoBordercutStatus', '已撤销上一步');
  });

  $('#idphotoBordercutReset').addEventListener('click', () => {
    if (!idphotoCropped) return;
    if (!confirm('确定要放弃所有涂抹，回到最初的裁剪图吗？')) return;
    bordercutHistory = [];
    bordercutStrokes = [];
    bordercutSrcCanvas = idphotoCropped;
    idphotoMatted = null;
    renderBordercutCanvas(bordercutSrcCanvas);
    say('#idphotoBordercutStatus', '已彻底重置为原图');
  });

  $('#idphotoBordercutApply').addEventListener('click', async () => {
    if (!bordercutStrokes.length) {
      say('#idphotoBordercutStatus', '请先在图片上涂抹', true);
      return;
    }
    if (!window.__bordercut) {
      say('#idphotoBordercutStatus', 'bordercut 库未加载，将直接使用原图（等同跳过）', true);
      // 降级：直接跳过
      idphotoMatteMode = 'skip';
      idphotoMatted = null;
      await goToOptions();
      return;
    }

    const btn = $('#idphotoBordercutApply');
    btn.disabled = true;
    say('#idphotoBordercutStatus', '正在处理涂抹区域…');

    try {
      const srcCanvas = bordercutSrcCanvas;
      const blob = await new Promise(res => srcCanvas.toBlob(res, 'image/png'));

      const points = bordercutStrokes.map(p => {
        let px = Math.round(p.x * srcCanvas.width);
        let py = Math.round(p.y * srcCanvas.height);
        px = Math.max(0, Math.min(srcCanvas.width - 1, px));
        py = Math.max(0, Math.min(srcCanvas.height - 1, py));
        return { x: px, y: py };
      });

      const { blob: resultBlob } = await window.__bordercut.removeBackgroundFromBlob(
        blob,
        { feather: 2 },
        { strokes: [{ kind: 'background', radius: 15, points: points }] }
      );

      const img = await loadImage(URL.createObjectURL(resultBlob));
      const out = document.createElement('canvas');
      out.width = img.width;
      out.height = img.height;
      out.getContext('2d').drawImage(img, 0, 0);

      // 保存历史
      const historyCanvas = document.createElement('canvas');
      historyCanvas.width = srcCanvas.width;
      historyCanvas.height = srcCanvas.height;
      historyCanvas.getContext('2d').drawImage(srcCanvas, 0, 0);
      bordercutHistory.push({ canvas: historyCanvas });

      bordercutSrcCanvas = out;
      idphotoMatted = { canvas: out, mode: 'bordercut' };
      bordercutStrokes = [];

      // 预览
      $('#idphotoBordercutStage').classList.add('hidden');
      $('#idphotoBordercutPreviewStage').classList.remove('hidden');
      const prevCanvas = $('#idphotoBordercutPreviewCanvas');
      const stageW = $('#idphotoBordercutPreviewStage').clientWidth || 320;
      const scale = stageW / out.width;
      const dispW = Math.round(out.width * scale);
      const dispH = Math.round(out.height * scale);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      prevCanvas.width = Math.round(dispW * dpr);
      prevCanvas.height = Math.round(dispH * dpr);
      prevCanvas.style.width = dispW + 'px';
      prevCanvas.style.height = dispH + 'px';
      const ctx = prevCanvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      for (let i = 0; i < dispW; i += 16) {
        for (let j = 0; j < dispH; j += 16) {
          ctx.fillStyle = ((i / 16 + j / 16) % 2 === 0) ? '#cbd5e1' : '#f1f5f9';
          ctx.fillRect(i, j, 16, 16);
        }
      }
      ctx.drawImage(out, 0, 0, dispW, dispH);

      $('#idphotoBordercutApply').classList.add('hidden');
      $('#idphotoBordercutConfirm').classList.remove('hidden');
      updateBordercutButtons();
      say('#idphotoBordercutStatus', '✅ 涂抹抠图完成，满意请点击下方确认', false, true);
    } catch (err) {
      console.error('[bordercut]', err);
      say('#idphotoBordercutStatus', '处理失败：' + (err && err.message ? err.message : err), true);
    } finally {
      btn.disabled = false;
    }
  });

  $('#idphotoBordercutConfirm').addEventListener('click', async () => {
    // 确认涂抹结果，进入第 4 步
    await goToOptions();
  });

  // ========== 进入第 4 步 ==========
  async function goToOptions() {
    // 确保有可用的图像源
    if (!idphotoMatteMode === 'skip' && !idphotoMatted) {
      // 如果跳过了背景处理，直接用裁剪图
      if (!idphotoCropped) {
        say('#idphotoBgStatus', '请先完成裁剪', true);
        return;
      }
    }

    $('#idphotoBgCard').classList.add('hidden');
    $('#idphotoOptCard').classList.remove('hidden');

    // 恢复跳过/涂抹按钮显示（如果之后重新进入第 3 步）
    $('#idphotoSkipBgBtn').style.display = '';
    $('#idphotoUseBordercutBtn').style.display = '';

    // 初始化状态
    idphotoState.x = 0;
    idphotoState.y = 0;
    await drawIdPhoto();
    say('#idphotoStatus', '调整好后点击下方保存。', false, true);
  }

  // ========== 第 4 步：绘制证件照 ==========
  async function ensureImageSource() {
    // 如果选择了跳过背景处理，直接使用裁剪图
    if (idphotoMatteMode === 'skip') {
      return idphotoCropped;
    }
    // 如果选择了涂抹且已有结果，使用涂抹结果
    if (idphotoMatted && idphotoMatted.canvas) {
      return idphotoMatted.canvas;
    }
    // 兜底：使用裁剪图（如果没涂抹就确认了）
    return idphotoCropped;
  }

  async function drawIdPhoto() {
    if (!idphotoImg) return;
    const srcCanvas = await ensureImageSource();
    if (!srcCanvas) return;

    const sizeKey = $('#idphotoSize').value;
    const bgColor = $('#idphotoBg').value;
    const layoutMode = $('#idphotoLayout').value;
    const target = targetSizes[sizeKey];
    const srcW = srcCanvas.width, srcH = srcCanvas.height;
    const canvas = $('#idphotoCanvas');

    function composeSingle() {
      const c = document.createElement('canvas');
      c.width = target.w;
      c.height = target.h;
      const g = c.getContext('2d');
      g.fillStyle = bgColor;
      g.fillRect(0, 0, target.w, target.h);

      const scale = Math.max(target.w / srcW, target.h / srcH);
      const drawW = srcW * scale;
      const drawH = srcH * scale;
      let dx, dy;
      if (idphotoState.x === 0 && idphotoState.y === 0) {
        // 默认位置：水平居中，垂直略偏上
        dx = (target.w - drawW) / 2;
        dy = (target.h - drawH) / 2 - target.h * 0.05;
      } else {
        dx = idphotoState.x;
        dy = idphotoState.y;
      }
      g.drawImage(srcCanvas, dx, dy, drawW, drawH);
      return c;
    }

    if (layoutMode === 'sheet') {
      canvas.width = 1050;
      canvas.height = 1500;
      canvas.style.width = '100%';
      canvas.style.height = 'auto';
      idphotoCtx = canvas.getContext('2d');
      idphotoCtx.fillStyle = '#fff';
      idphotoCtx.fillRect(0, 0, canvas.width, canvas.height);

      const single = composeSingle();
      const margin = 40, gap = 20;
      const cols = Math.floor((canvas.width - margin * 2 + gap) / (target.w + gap));
      const rows = Math.floor((canvas.height - margin * 2 + gap) / (target.h + gap));
      const startX = (canvas.width - (cols * target.w + (cols - 1) * gap)) / 2;
      const startY = (canvas.height - (rows * target.h + (rows - 1) * gap)) / 2;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = startX + c * (target.w + gap);
          const y = startY + r * (target.h + gap);
          idphotoCtx.drawImage(single, x, y);
          idphotoCtx.strokeStyle = '#999';
          idphotoCtx.lineWidth = 1;
          idphotoCtx.setLineDash([5, 5]);
          idphotoCtx.strokeRect(x, y, target.w, target.h);
        }
      }
    } else {
      canvas.width = target.w;
      canvas.height = target.h;
      canvas.style.width = '180px';
      canvas.style.height = (180 * target.h / target.w) + 'px';
      idphotoCtx = canvas.getContext('2d');
      idphotoCtx.drawImage(composeSingle(), 0, 0);
    }
    $('#idphotoPreviewWrap').classList.remove('hidden');
  }

  // 尺寸/底色/排版变更时重绘
  $('#idphotoSize').addEventListener('change', () => {
    idphotoState.x = 0; idphotoState.y = 0;
    if (!$('#idphotoPreviewWrap').classList.contains('hidden')) drawIdPhoto();
  });
  $('#idphotoBg').addEventListener('change', () => {
    if (!$('#idphotoPreviewWrap').classList.contains('hidden')) drawIdPhoto();
  });
  $('#idphotoLayout').addEventListener('change', () => {
    idphotoState.x = 0; idphotoState.y = 0;
    if (!$('#idphotoPreviewWrap').classList.contains('hidden')) drawIdPhoto();
  });

  // 单张模式拖动
  (function bindDrag() {
    const canvas = $('#idphotoCanvas');
    if (!canvas) return;
    canvas.addEventListener('pointerdown', (e) => {
      if (!idphotoImg || $('#idphotoLayout').value !== 'single') return;
      idphotoState.dragging = true;
      idphotoState.startX = e.clientX;
      idphotoState.startY = e.clientY;
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      e.preventDefault();
    }, { passive: false });
    canvas.addEventListener('pointermove', (e) => {
      if (!idphotoState.dragging) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const dx = (e.clientX - idphotoState.startX) * scaleX;
      const dy = (e.clientY - idphotoState.startY) * scaleY;
      idphotoState.startX = e.clientX;
      idphotoState.startY = e.clientY;
      idphotoState.x += dx;
      idphotoState.y += dy;
      drawIdPhoto();
      e.preventDefault();
    }, { passive: false });
    function endDrag(e) {
      idphotoState.dragging = false;
      try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
  })();

  // ========== 保存图片 ==========
  $('#idphotoDownloadBtn').addEventListener('click', async () => {
    const canvas = $('#idphotoCanvas');
    const btn = $('#idphotoDownloadBtn');
    if (!canvas || !canvas.width) {
      say('#idphotoStatus', '请先生成证件照预览', true);
      return;
    }
    btn.disabled = true;
    try {
      const blob = await new Promise((res, rej) => {
        canvas.toBlob((b) => b ? res(b) : rej(new Error('生成图片失败')), 'image/jpeg', 0.95);
      });
      const filename = '证件照_' + Date.now() + '.jpg';
      await saveWithPath(blob, filename);
    } catch (e) {
      say('#idphotoStatus', '保存失败：' + (e && e.message ? e.message : e), true);
    } finally {
      btn.disabled = false;
    }
  });

  async function saveWithPath(blob, filename) {
    if (window.isSecureContext && typeof window.showSaveFilePicker === 'function') {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{ description: 'JPEG 图片', accept: { 'image/jpeg': ['.jpg', '.jpeg'] } }]
        });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        say('#idphotoStatus', '✅ 已保存：' + (handle.name || filename), false, true);
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') {
          say('#idphotoStatus', '已取消保存');
          return;
        }
      }
    }
    // 降级下载
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      try { document.body.removeChild(a); } catch (_) {}
      setTimeout(() => { try { URL.revokeObjectURL(url); } catch (_) {} }, 60000);
    }, 5000);
    say('#idphotoStatus', '已触发下载：' + filename, false, true);
  }

  // ========== 窗口大小变化 ==========
  let rt = null;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      if (!$('#idphotoCropCard').classList.contains('hidden') && idphotoImg) {
        renderCrop();
      }
      if (!$('#idphotoBgCard').classList.contains('hidden') && bordercutSrcCanvas) {
        renderBordercutCanvas(bordercutSrcCanvas);
      }
    }, 200);
  });

  // ========== 占位：bordercut 库（实际项目中由外部加载） ==========
  // 这里检测一下，如果没有就用降级方案
  if (!window.__bordercut) {
    console.warn('bordercut 库未加载，涂抹功能将降级为跳过背景');
  }

})();
</script>
</body>
</html>
