<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fffdf9">
<title>户型装修设计</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div class="app">
  <header id="header"></header>
  <aside class="lib" id="libAside">
    <div id="lib3d" class="only3d">
      <h4 data-en="Rooms · click to fly there">房间 · 点击飞到该房间</h4>
      <div id="roomList"></div>
    </div>
    <div id="lib"></div>
  </aside>
  <main id="stage">
    <svg id="plan" class="tool-select" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
      <defs id="defs"></defs>
      <g id="gGrid"></g><g id="gRooms"></g><g id="gFurn"></g><g id="gWalls"></g>
      <g id="gOpen"></g><g id="gLabels" pointer-events="none"></g>
      <g id="gDims" pointer-events="none"></g><g id="gMeasure" pointer-events="none"></g><g id="gSel"></g>
    </svg>
    <div id="view3d">
      <div id="walkOverlay"><div><h3 data-en="Walk mode">漫游模式</h3>
        <p id="wo1"></p><p id="wo2"></p><p id="wo3"></p></div></div>
      <div id="cross"></div>
      <div id="joy"><i></i></div>
      <button class="btn primary" id="walkExit" data-en="Exit walk">退出漫游</button>
      <div id="hint3d"></div>
    </div>
    <div class="scalebar" id="scalebar"><span id="sbText">1 m</span><div class="bar" id="sbBar"></div></div>
    <div class="modehint" id="modehint"></div>
    <div id="fab"></div>
  </main>
  <aside class="right" id="panelAside"><div id="panel"></div></aside>
  <footer id="footer"></footer>
</div>
<div id="toast"></div>
<script type="module" src="main.js"></script>
</body>
</html>
