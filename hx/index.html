<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fffdf9">
<title>户型装修设计</title>
<style>
:root{--bg:#f3efe7;--paper:#f7f4ee;--panel:#fffdf9;--line:#e3dccf;--ink:#2b2824;--muted:#8a8174;--accent:#b5653a;--accent-soft:#f3e3d8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) 30px;grid-template-columns:236px minmax(0,1fr) 300px;height:100vh;height:100dvh}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;margin-right:8px;line-height:1.25}
.brand b{font-size:15px}
.brand span{color:var(--muted);font-size:12px}
.grp{display:flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff}
.btn{border:0;background:transparent;padding:5px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f2ece2}
.btn.on{background:var(--ink);color:#fff}
.btn.chip.on{background:var(--accent-soft);color:var(--accent)}
.btn.danger{color:#b3372a}
.btn.primary{background:var(--accent);color:#fff}
.spacer{flex:1}
aside{background:var(--panel);overflow:auto;border-right:1px solid var(--line)}
aside.right{border-right:0;border-left:1px solid var(--line)}
.lib h4{margin:0;padding:12px 14px 6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:1px;position:sticky;top:0;background:var(--panel);z-index:1}
.lib-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px 6px}
.item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:grab;user-select:none;transition:border-color .15s}
.item:hover{border-color:var(--accent)}
.item svg{width:56px;height:44px}
.item b{font-weight:500;font-size:12px}
.item small{color:var(--muted);font-size:11px}
main{position:relative;overflow:hidden;background:var(--paper)}
#plan{width:100%;height:100%;display:block;touch-action:none}
#plan.panning{cursor:grabbing}
#plan .wall{pointer-events:all;cursor:pointer}
#plan .furn{cursor:move}
[data-wall-handle],[data-door-handle],[data-win-handle],[data-handle]{cursor:pointer}
.dim-hit{cursor:pointer;pointer-events:all}
.dim-hit:hover{fill:#b5653a}
#empty-hint{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:8px;pointer-events:none;color:#8a8174;font-size:14px;text-align:center;padding:20px}
#empty-hint .big{font-size:22px;font-weight:600;color:#2b2824}
#empty-hint kbd{font:11px monospace;background:#f2ece2;border:1px solid #e3dccf;border-radius:4px;padding:1px 5px}
.scalebar{position:absolute;left:14px;bottom:12px;background:rgba(255,253,249,.92);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;pointer-events:none}
.scalebar .bar{height:6px;border:1.5px solid var(--ink);border-top:0;margin-top:3px}
.modehint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:5px 12px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
.modehint.show{opacity:.9}
footer{grid-column:1/-1;display:flex;gap:18px;align-items:center;padding:0 14px;background:var(--panel);overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
footer b{color:var(--ink);font-weight:500}
#panel section{padding:12px 16px;border-bottom:1px solid var(--line)}
#panel h3{margin:0 0 8px;font-size:13px}
#panel h3 small{color:var(--muted);font-weight:400;margin-left:6px}
table{width:100%;border-collapse:collapse}
td{padding:4px 2px;border-bottom:1px dashed #eee6d9}
td.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:#faf5ee}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.15);vertical-align:-2px;margin-right:6px}
.total{display:flex;justify-content:space-between;margin-top:8px;font-size:14px}
.total b{color:var(--accent)}
.muted{color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form label.full{grid-column:1/-1}
.form input,.form select{border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#fff;width:100%}
.form input[type=color]{padding:2px;height:30px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.actions .btn{border:1px solid var(--line);background:#fff}
.mats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mat{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;cursor:pointer;text-align:left}
.mat.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.mat i{width:26px;height:26px;border-radius:5px;border:1px solid rgba(0,0,0,.12);flex:none}
.mat span{font-size:12px;line-height:1.3}
.mat small{display:block;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.stats div{background:#faf6ef;border-radius:8px;padding:8px}
.stats small{display:block;color:var(--muted);font-size:11px}
.big{font-size:22px;font-weight:600}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:8px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:10}
#toast.show{opacity:1;transform:translateX(-50%)}
#fab{position:absolute;left:50%;bottom:16px;transform:translate(-50%,12px);display:flex;align-items:center;gap:4px;padding:5px;background:rgba(255,253,249,.97);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 26px rgba(40,30,20,.16);z-index:4;opacity:0;visibility:hidden;transition:.2s}
#fab.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
#fab .name{padding:0 8px 0 6px;font-weight:600}
#fab .btn{border:1px solid transparent}
.seg{position:relative;padding:3px}
.seg .btn{width:82px}
.seg .btn.on{background:var(--accent);color:#fff}
#view3d{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s}
main.is3d #view3d{opacity:1;visibility:visible}
main.is3d #plan{opacity:0;pointer-events:none}
#view3d canvas{display:block;outline:none}
.menu{position:relative}
.menu summary{list-style:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
.menu summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);display:flex;flex-direction:column;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 10px 30px rgba(40,30,20,.14);z-index:20}
.menu-pop .btn{text-align:left}
.range{display:flex;align-items:center;gap:4px;padding:0 6px;color:var(--muted);font-size:11px}
.range input{width:60px;accent-color:var(--accent)}
@media (max-width:1100px){
  .app{grid-template-columns:minmax(0,1fr)}
  main,aside.lib,aside.right{grid-row:2;grid-column:1}
  aside.lib,aside.right{position:relative;z-index:6;width:min(320px,86vw);transition:transform .3s}
  aside.lib{justify-self:start;transform:translateX(-110%)}
  aside.right{justify-self:end;transform:translateX(110%)}
  aside.open{transform:none;box-shadow:0 0 30px rgba(40,30,20,.18)}
  .lib-grid{grid-template-columns:1fr 1fr 1fr}
}
</style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div class="app">
  <header>
    <div class="grp"><button class="btn chip on" id="tgLib">◧ 家具库</button><button class="btn chip on" id="tgPanel">属性 ◨</button></div>
    <div class="brand"><b>户型设计 · 可编辑</b><span id="subtitle">尺寸单位 mm</span></div>
    <div class="grp seg" id="viewSeg"><button class="btn on" data-view="2d">2D 平面</button><button class="btn" data-view="3d">3D 场景</button></div>
    <div class="grp" id="tools">
      <button class="btn on" data-tool="select">选择</button>
      <button class="btn" data-tool="addRoom">新建房间</button>
      <button class="btn" data-tool="addWall">加墙</button>
      <button class="btn" data-tool="addDoor">加门</button>
      <button class="btn" data-tool="addWin">加窗</button>
      <button class="btn" data-tool="measure">测量</button>
      <button class="btn" data-tool="demolish">拆墙</button>
    </div>
    <div class="grp"><button class="btn" id="zoomOut">−</button><button class="btn" id="zoomIn">＋</button><button class="btn" id="fit">适应</button></div>
    <div class="grp">
      <button class="btn chip on" id="toggleDims" title="显示/隐藏尺寸">尺寸</button>
      <label class="range">字号 <input type="range" id="dimScale" min="0.6" max="2" step="0.1" value="1"></label>
    </div>
    <div class="grp"><button class="btn" id="undo">撤销</button><button class="btn" id="redo">重做</button></div>
    <div class="spacer"></div>
    <details class="menu"><summary>文件 ▾</summary>
      <div class="menu-pop">
        <button class="btn" id="newPlan">新建空白户型</button>
        <button class="btn" id="exportJson">导出方案 JSON</button>
        <button class="btn" id="importJson">导入方案</button>
        <button class="btn danger" id="reset">重置为默认</button>
      </div></details>
    <input type="file" id="fileIn" accept=".json" hidden>
  </header>
  <aside class="lib"><div id="lib"></div></aside>
  <main id="stage">
    <div id="empty-hint">
      <div class="big">空白画布</div>
      <div>点击工具栏「新建房间」，在画布上拖一个矩形开始画</div>
      <div style="font-size:12px">或按 <kbd>N</kbd> 快捷键 · 画完点尺寸数字可以改大小</div>
    </div>
    <svg id="plan" class="tool-select" font-family="-apple-system,'PingFang SC',sans-serif">
      <defs id="defs"></defs>
      <g id="gRooms"></g><g id="gFurn"></g><g id="gWalls"></g><g id="gOpen"></g>
      <g id="gLabels" pointer-events="none"></g><g id="gDims" pointer-events="none"></g>
      <g id="gMeasure" pointer-events="none"></g><g id="gSel"></g>
    </svg>
    <div id="view3d"></div>
    <div class="scalebar" id="scalebar"><span id="sbText">1 m</span><div class="bar" id="sbBar"></div></div>
    <div class="modehint" id="modehint"></div>
    <div id="fab"></div>
  </main>
  <aside class="right"><div id="panel"></div></aside>
  <footer>
    <span>X <b id="cx">—</b></span><span>Y <b id="cy">—</b></span>
    <span>比例 <b id="ratio">—</b></span>
    <span id="hover"></span><span class="spacer"></span><span id="tip"></span>
  </footer>
</div>
<div id="toast"></div>

function defaultState(){
  const rooms = {};
  ROOMS_SEED.forEach(r => rooms[r.id] = {name:r.name, mat:r.mat, poly:r.poly.map(p=>[...p])});
  return {
    walls: WALLS.map((w,i) => ({id:'w'+i, x0:w[0], y0:w[1], x1:w[2], y1:w[3], type:w[4]})),
    wins: WINS.map((r,i) => ({id:'win'+i, x0:r[0], y0:r[1], x1:r[2], y1:r[3]})),
    doors: DOORS.map((d,i) => ({id:'door'+i, ...d, rect:[...d.rect], h:[...d.h], c:[...d.c], o:[...d.o]})),
    rooms, roomOrder: ROOMS_SEED.map(r => r.id),
    roomAt: ROOMS_SEED.reduce((o,r) => (o[r.id] = r.at, o), {}),
    furniture: defaultFurniture(), demolished: [], measures: [],
  };
}
const STORE = 'huxing-design-v8';
function load(){ try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && Array.isArray(s.furniture)) return fixState(s); } catch(e) {} return null; }
function fixState(s){
  const d = defaultState();
  s.walls ??= d.walls; s.wins ??= d.wins; s.doors ??= d.doors;
  s.rooms = Object.assign({}, d.rooms, s.rooms || {});
  s.roomOrder ??= Object.keys(s.rooms);
  s.roomAt ??= {};
  s.demolished ??= []; s.measures ??= [];
  return s;
}

const bbox = poly => { const xs=poly.map(p=>p[0]),ys=poly.map(p=>p[1]); return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]; };
const wallLen = w => Math.hypot(w.x1-w.x0,w.y1-w.y0);
const aabb = f => { const a=f.rot*Math.PI/180,c=Math.abs(Math.cos(a)),s=Math.abs(Math.sin(a)); return {hw:f.w/2*c+f.d/2*s,hh:f.w/2*s+f.d/2*c}; };

const hex2rgb = h => { h=h.replace('#',''); if(h.length===3)h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; };
const shade = (h,k) => { const f=v=>Math.max(0,Math.min(255,Math.round(k>1?v+(255-v)*(k-1)*2:v*k))); return '#'+hex2rgb(h).map(v=>f(v).toString(16).padStart(2,'0')).join(''); };

function renderRooms(){
  let s = '';
  state.roomOrder.forEach(id => {
    const r = state.rooms[id]; if (!r?.poly?.length) return;
    s += `<polygon class="room" data-room="${id}" points="${r.poly.map(p=>p.join(',')).join(' ')}" fill="url(#m-${r.mat})"/>`;
  });
  $('#gRooms').innerHTML = s;
}
function renderFurn(){
  $('#gFurn').innerHTML = state.furniture.map(f => {
    const fs = Math.max(80, Math.min(160, Math.min(f.w,f.d)*.2));
    return `<g class="furn" data-fid="${f.id}" transform="translate(${f.cx} ${f.cy}) rotate(${f.rot})">${furnSVG(f.type,f.w,f.d,f.color)}<text transform="rotate(${-f.rot})" font-size="${fs}" text-anchor="middle" dominant-baseline="central" fill="#4a443c" opacity=".8" pointer-events="none">${esc(f.name)}</text></g>`;
  }).join('');
}
function renderWalls(){
  $('#gWalls').innerHTML = state.walls.map(w => {
    const dem = state.demolished.includes(w.id);
    let fill = w.type==='b' ? '#26241f' : w.type==='e' ? '#8f897d' : w.type==='low' ? '#e9e3d8' : '#a7a195';
    if (dem) fill = 'rgba(198,91,58,.12)';
    if (ui.sel?.kind==='wall' && ui.sel.id===w.id) fill = '#c65b3a';
    const x=Math.min(w.x0,w.x1),y=Math.min(w.y0,w.y1),ww=Math.abs(w.x1-w.x0),hh=Math.abs(w.y1-w.y0);
    return `<rect class="wall" data-wall="${w.id}" x="${x}" y="${y}" width="${ww}" height="${hh}" fill="${fill}"/>`;
  }).join('');
}
function renderOpenings(){
  let s = '';
  state.wins.forEach(w => {
    const ww=w.x1-w.x0,hh=w.y1-w.y0;
    const sel = ui.sel?.kind==='win' && ui.sel.id===w.id;
    s += `<rect class="win" data-win="${w.id}" x="${w.x0}" y="${w.y0}" width="${ww}" height="${hh}" fill="${sel?'#cfe3f0':'#f7fbfd'}" stroke="#4f7394" stroke-width="1"/>`;
    if (ww >= hh) [1/3,2/3].forEach(t => s += `<line x1="${w.x0}" y1="${w.y0+hh*t}" x2="${w.x1}" y2="${w.y0+hh*t}" stroke="#4f7394"/>`);
    else [1/3,2/3].forEach(t => s += `<line x1="${w.x0+ww*t}" y1="${w.y0}" x2="${w.x0+ww*t}" y2="${w.y1}" stroke="#4f7394"/>`);
  });
  state.doors.forEach(d => {
    const [hx,hy]=d.h,L=d.len,T=40;
    const ox=hx+d.o[0]*L,oy=hy+d.o[1]*L,cx=hx+d.c[0]*L,cy=hy+d.c[1]*L;
    const sweep = d.o[0]*d.c[1]-d.o[1]*d.c[0] > 0 ? 1 : 0;
    const sel = ui.sel?.kind==='door' && ui.sel.id===d.id;
    const col = sel ? '#c65b3a' : d.entry ? '#b5653a' : '#3d3a34';
    s += `<polygon class="door" data-door="${d.id}" points="${hx},${hy} ${ox},${oy} ${ox+d.c[0]*T},${oy+d.c[1]*T} ${hx+d.c[0]*T},${hy+d.c[1]*T}" fill="#fff" stroke="${col}" stroke-width="${sel?2:1}"/>`;
    s += `<path d="M${ox} ${oy}A${L} ${L} 0 0 ${sweep} ${cx} ${cy}" fill="none" stroke="#3d3a34" stroke-width="1" stroke-dasharray="5 3" opacity=".7"/>`;
  });
  $('#gOpen').innerHTML = s;

function bindRoomPanel(id){

/* ============ 断墙 / 补墙 ============ */
function splitWallAtOpening(w, op){
  const [ox0, oy0, ox1, oy1] = op, t = 5;
  const vertical = Math.abs(w.x1-w.x0) < Math.abs(w.y1-w.y0);
  if (vertical){
    const mid = (w.x0+w.x1)/2;
    if (mid < ox0-t || mid > ox1+t) return [];
    if (oy1 <= w.y0+t || oy0 >= w.y1-t) return [];
    const out = [];
    if (oy0 > w.y0+t) out.push({...w, id:uid('w'), y0:w.y0, y1:oy0});
    if (oy1 < w.y1-t) out.push({...w, id:uid('w'), y0:oy1, y1:w.y1});
    if (out.length === 2) out.push({__remove:w.id});
    return out;
  } else {
    const mid = (w.y0+w.y1)/2;
    if (mid < oy0-t || mid > oy1+t) return [];
    if (ox1 <= w.x0+t || ox0 >= w.x1-t) return [];
    const out = [];
    if (ox0 > w.x0+t) out.push({...w, id:uid('w'), x0:w.x0, x1:ox0});
    if (ox1 < w.x1-t) out.push({...w, id:uid('w'), x0:ox1, x1:w.x1});
    if (out.length === 2) out.push({__remove:w.id});
    return out;
  }
}
function breakWalls(opening){
  const removed = [], newWalls = [];
  for (const ww of state.walls){
    const parts = splitWallAtOpening(ww, opening);
    if (parts.length === 0) newWalls.push(ww);
    else parts.forEach(p => { if (p.__remove) removed.push(p.__remove); else newWalls.push(p); });
  }
  state.walls = newWalls.filter(w => !removed.includes(w.id));
}
function fillGapAfterOpening(rect){
  if (!rect) return;
  const [ox0, oy0, ox1, oy1] = rect;
  const vertical = (oy1-oy0) > (ox1-ox0);
  const cx = (ox0+ox1)/2, cy = (oy0+oy1)/2;
  const covered = state.walls.some(w => {
    const v = Math.abs(w.x1-w.x0) < Math.abs(w.y1-w.y0);
    if (vertical !== v) return false;
    if (vertical) return Math.abs((w.x0+w.x1)/2 - cx) < 20 && w.y0 <= oy0+5 && w.y1 >= oy1-5;
    return Math.abs((w.y0+w.y1)/2 - cy) < 20 && w.x0 <= ox0+5 && w.x1 >= ox1-5;
  });
  if (covered) return;
  const t = vertical ? Math.max(100, ox1-ox0) : Math.max(100, oy1-oy0);
  if (vertical){
    state.walls.push({id:uid('w'), x0:cx-t/2, y0:oy0, x1:cx+t/2, y1:oy1, type:'n'});
  } else {
    state.walls.push({id:uid('w'), x0:ox0, y0:cy-t/2, x1:ox1, y1:cy+t/2, type:'n'});
  }
}

function addDoorOnWall(wid){
  const w = state.walls.find(x => x.id === wid); if (!w) return;
  const vertical = Math.abs(w.y1-w.y0) > Math.abs(w.x1-w.x0);
  const wLen = wallLen(w);
  if (wLen < 400) return toast('墙体太短');
  const len = Math.min(900, Math.round(wLen/2/10)*10);
  const cx = (w.x0+w.x1)/2, cy = (w.y0+w.y1)/2, t = 100;
  const d = {
    id: uid('door'), name:'门', len,
    rect: vertical ? [Math.round(cx)-t, Math.round(cy)-len/2, Math.round(cx)+t, Math.round(cy)+len/2]
                   : [Math.round(cx)-len/2, Math.round(cy)-t, Math.round(cx)+len/2, Math.round(cy)+t],
    h: vertical ? [Math.round(cx), Math.round(cy)+len/2] : [Math.round(cx)+len/2, Math.round(cy)],
    c: vertical ? [0,-1] : [-1,0], o: vertical ? [-1,0] : [0,-1],
  };
  ui.sel = {kind:'door', id:d.id};
  mutate(() => { state.doors.push(d); breakWalls(d.rect); });
  toast('已在此墙加门');
}
function addWinOnWall(wid){
  const w = state.walls.find(x => x.id === wid); if (!w) return;
  const vertical = Math.abs(w.y1-w.y0) > Math.abs(w.x1-w.x0);
  const wLen = wallLen(w);
  if (wLen < 600) return toast('墙体太短');
  const len = Math.min(1600, Math.round(wLen*0.6/10)*10);

  const win = vertical ? {id:uid('win'), x0:Math.round(cx)-t, y0:Math.round(cy)-len/2, x1:Math.round(cx)+t, y1:Math.round(cy)+len/2}

  mutate(() => { state.wins.push(win); breakWalls([win.x0, win.y0, win.x1, win.y1]); });

}
function createRoom(pts){
  if (pts.length < 3) return;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const L = Math.min(...xs), T = Math.min(...ys), Rr = Math.max(...xs), B = Math.max(...ys);
  const id = 'room-' + Date.now().toString(36);
  const n = state.roomOrder.length + 1;
  const t = 120;
  const walls = [
    {id:uid('w'), x0:L-t, y0:T-t, x1:Rr+t, y1:T, type:'n'},
    {id:uid('w'), x0:Rr, y0:T-t, x1:Rr+t, y1:B+t, type:'n'},
    {id:uid('w'), x0:L-t, y0:B, x1:Rr+t, y1:B+t, type:'n'},
    {id:uid('w'), x0:L-t, y0:T-t, x1:L, y1:B+t, type:'n'},
  ];
  mutate(() => {
    state.rooms[id] = {name:`房间 ${n}`, mat:'wood', poly:pts.map(p=>[Math.round(p[0]), Math.round(p[1])])};
    state.roomOrder.push(id);
    state.roomAt[id] = [(L+Rr)/2, (T+B)/2];

  });
  ui.sel = {kind:'room', id};

  toast(`已新建 ${Rr-L}×${B-T} 房间，可点尺寸数字改大小`);
}
function applyDimChange(key, oldVal, newVal){
  const delta = newVal - oldVal;
  const parts = key.split('-'), side = parts[0];
  if (parts[1] === 'total') return;
  const idx = +parts[1];
  const xs = new Set(), ys = new Set();
  state.walls.forEach(w => { xs.add(w.x0); xs.add(w.x1); ys.add(w.y0); ys.add(w.y1); });
  const dedupe = arr => { const a=[...arr].sort((a,b)=>a-b),out=[]; for (const v of a) if (!out.length || v-out[out.length-1] > 10) out.push(v); return out; };
  const xLines = dedupe(xs), yLines = dedupe(ys);
  const axis = (side === 'top' || side === 'bottom') ? 'x' : 'y';
  const lines = axis === 'x' ? xLines : yLines;
  if (idx >= lines.length - 1) return;
  const threshold = lines[idx + 1];
  mutate(() => {
    state.walls.forEach(w => { if (axis==='x'){ if (w.x0>=threshold-1)w.x0+=delta; if(w.x1>=threshold-1)w.x1+=delta; } else { if(w.y0>=threshold-1)w.y0+=delta; if(w.y1>=threshold-1)w.y1+=delta; } });
    state.wins.forEach(w => { if (axis==='x'){ if (w.x0>=threshold-1)w.x0+=delta; if(w.x1>=threshold-1)w.x1+=delta; } else { if(w.y0>=threshold-1)w.y0+=delta; if(w.y1>=threshold-1)w.y1+=delta; } });
    state.doors.forEach(d => { const mx=(d.rect[0]+d.rect[2])/2, my=(d.rect[1]+d.rect[3])/2; if (axis==='x'&&mx>=threshold-1){d.rect[0]+=delta;d.rect[2]+=delta;d.h[0]+=delta;} else if(axis==='y'&&my>=threshold-1){d.rect[1]+=delta;d.rect[3]+=delta;d.h[1]+=delta;} });
    state.furniture.forEach(f => { if (axis==='x'&&f.cx>=threshold-1) f.cx+=delta; else if(axis==='y'&&f.cy>=threshold-1) f.cy+=delta; });
    state.roomOrder.forEach(id => { const r = state.rooms[id]; if (!r?.poly) return; r.poly = r.poly.map(([x,y]) => [x>=threshold-1?x+(axis==='x'?delta:0):x, y>=threshold-1?y+(axis==='y'?delta:0):y]); });
    Object.keys(state.roomAt).forEach(id => { const at = state.roomAt[id]; if (!at) return; if (axis==='x'&&at[0]>=threshold-1) state.roomAt[id]=[at[0]+delta,at[1]]; else if (axis==='y'&&at[1]>=threshold-1) state.roomAt[id]=[at[0],at[1]+delta]; });
  });
  toast(`尺寸已改为 ${newVal} mm`);
}

function setTool(t){

function fitView(){
  const W = svg.clientWidth, H = svg.clientHeight;

  const xs = state.walls.flatMap(w => [w.x0, w.x1]), ys = state.walls.flatMap(w => [w.y0, w.y1]);
  const x0 = Math.min(...xs)-2000, y0 = Math.min(...ys)-2000, x1 = Math.max(...xs)+2000, y1 = Math.max(...ys)+2000;

const zoomCenter = k => { const W = svg.clientWidth, H = svg.clientHeight, ns = Math.max(.012, Math.min(2, view.s*k)); const px = view.x0+W/2/view.s, py = view.y0+H/2/view.s; view.s = ns; view.x0 = px-W/2/ns; view.y0 = py-H/2/ns; applyView(); };

let drag = null, pinch = null;
const touches = new Map();
const svgXY = (x, y) => { const r = svg.getBoundingClientRect(); return [x-r.left, y-r.top]; };

function endDrag(cancel){
  const d = drag; drag = null; svg.classList.remove('panning');

svg.addEventListener('pointerdown', e => {
  if (e.button === 1 || e.button === 2) return;
  $('details.menu').open = false;
  if (e.pointerType !== 'mouse'){
    touches.set(e.pointerId, {x:e.clientX, y:e.clientY});

svg.addEventListener('pointermove', e => {

  const p = toMM(e);
  $('#cx').textContent = Math.round(p.x) + ' mm'; $('#cy').textContent = Math.round(p.y) + ' mm';

  const far = Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) >= TAP;
  if (drag.kind === 'addRoom-rect'){

    renderWalls(); renderRooms(); renderOpenings(); renderDims(); renderSel(); return;
  }
  if (drag.kind === 'door-handle'){
    if (!drag.moved && !far) return; drag.moved = true;
    const d = state.doors.find(x => x.id === drag.id); if (!d) return;
    if (drag.sub === 'rot'){
      const ax = d.h[0], ay = d.h[1];
      let ang = Math.atan2(p.y - ay, p.x - ax);
      const cAng = Math.atan2(d.c[1], d.c[0]);
      let rel = ang - cAng;
      while (rel > Math.PI) rel -= Math.PI * 2;
      while (rel < -Math.PI) rel += Math.PI * 2;
      rel = Math.round(rel / (Math.PI / 12)) * (Math.PI / 12);
      d.o = [Math.cos(cAng + rel), Math.sin(cAng + rel)];
      renderOpenings(); renderSel(); return;
    }
    const vertical = Math.abs(d.c[1]) > Math.abs(d.c[0]);
    const sp = {x:snapV(p.x), y:snapV(p.y)};
    if (drag.sub === 'a'){
      if (vertical){ d.h[1] = sp.y; const oldEnd = d.h[1] + d.c[1]*d.len; d.rect[1] = Math.min(d.h[1], oldEnd); d.rect[3] = Math.max(d.h[1], oldEnd); d.len = Math.abs(d.rect[3]-d.rect[1]); }
      else { d.h[0] = sp.x; const oldEnd = d.h[0] + d.c[0]*d.len; d.rect[0] = Math.min(d.h[0], oldEnd); d.rect[2] = Math.max(d.h[0], oldEnd); d.len = Math.abs(d.rect[2]-d.rect[0]); }
    } else {
      if (vertical){ d.len = Math.max(300, Math.abs(sp.y-d.h[1])); const sgn = sp.y>d.h[1]?1:-1; d.c = [0,sgn]; d.rect[1] = Math.min(d.h[1], d.h[1]+sgn*d.len); d.rect[3] = Math.max(d.h[1], d.h[1]+sgn*d.len); }

    drag.origWalls.forEach((ow, i) => { const w = state.walls[i]; if (!w) return; const mx = (ow.x0+ow.x1)/2, my = (ow.y0+ow.y1)/2; if (inBox(mx,my)){ w.x0 = ow.x0+dx; w.y0 = ow.y0+dy; w.x1 = ow.x1+dx; w.y1 = ow.y1+dy; } });
    drag.origWins.forEach((ow, i) => { const w = state.wins[i]; if (!w) return; const mx = (ow.x0+ow.x1)/2, my = (ow.y0+ow.y1)/2; if (inBox(mx,my)){ w.x0 = ow.x0+dx; w.y0 = ow.y0+dy; w.x1 = ow.x1+dx; w.y1 = ow.y1+dy; } });
    drag.origDoors.forEach((od, i) => { const d = state.doors[i]; if (!d) return; const mx = (od.rect[0]+od.rect[2])/2, my = (od.rect[1]+od.rect[3])/2; if (inBox(mx,my)){ d.rect[0] = od.rect[0]+dx; d.rect[2] = od.rect[2]+dx; d.rect[1] = od.rect[1]+dy; d.rect[3] = od.rect[3]+dy; d.h[0] = od.h[0]+dx; d.h[1] = od.h[1]+dy; } });

function onPointerEnd(e){
  touches.delete(e.pointerId);
  if (pinch){ if (touches.size < 2) pinch = null; return; }

svg.addEventListener('pointercancel', onPointerEnd);
svg.addEventListener('wheel', e => { e.preventDefault(); const r = svg.getBoundingClientRect(); const ns = Math.max(.012, Math.min(2, view.s*Math.exp(-e.deltaY*.0015))); const px = view.x0 + (e.clientX-r.left)/view.s, py = view.y0 + (e.clientY-r.top)/view.s; view.s = ns; view.x0 = px - (e.clientX-r.left)/ns; view.y0 = py - (e.clientY-r.top)/ns; applyView(); }, {passive:false});

document.addEventListener('keydown', e => {

  state.walls.forEach(w=>{
    if (state.demolished.includes(w.id)) return;
    const r = [Math.min(w.x0,w.x1), Math.min(w.y0,w.y1), Math.max(w.x0,w.x1), Math.max(w.y0,w.y1)];
    wallBox(r, 0, w.type==='low' ? 1 : opt.cut);
  });
  state.wins.forEach(r=>{
    const sill=.9, head=2.4;
    wallBox([r.x0,r.y0,r.x1,r.y1], 0, Math.min(sill, opt.cut));
    if (opt.cut > head) wallBox([r.x0,r.y0,r.x1,r.y1], head, opt.cut);
    const gTop = Math.min(head, opt.cut); if (gTop <= sill) return;
    const hz = (r.x1-r.x0) >= (r.y1-r.y0), L = M(hz ? r.x1-r.x0 : r.y1-r.y0), gh = gTop - sill, cx = wx((r.x0+r.x1)/2), cz = wz((r.y0+r.y1)/2);
    const pane = new THREE.Mesh(new THREE.BoxGeometry(hz ? L : .01, gh, hz ? .01 : L), glassMat); pane.position.set(cx, sill + gh/2, cz); archUp.add(pane);
  });
  state.doors.forEach(d=>{
    const pivot = new THREE.Group(), L = M(d.len), dh = Math.min(2.05, opt.cut);
    pivot.position.set(wx(d.h[0]), 0, wz(d.h[1]));
    const leaf = new THREE.Mesh(new THREE.BoxGeometry(L, dh, .04), mat(d.entry ? '#6b4f3a' : '#efe6d8', {roughness:.5}));
    leaf.position.set(L/2, dh/2, 0); leaf.castShadow = leaf.receiveShadow = true;
    pivot.add(leaf);
    const ang = v => Math.atan2(-v[1], v[0]), door = {pivot, a0:ang(d.c), a1:ang(d.o), open:true};
    if (door.a1-door.a0 > Math.PI) door.a1 -= Math.PI*2; if (door.a0-door.a1 > Math.PI) door.a1 += Math.PI*2;
    door.cur = door.a1; pivot.rotation.y = door.cur;
    doors.push(door); archUp.add(pivot);
  });
  applyLight();
}
function buildFurn(){ clearGroup(furnG); state.furniture.forEach(f=>furnG.add(buildFurniture(f))); }

function sync(force){
  if (!inited || (!active && !force)) return;
  const a = JSON.stringify([state.rooms, state.walls, state.wins, state.doors, state.demolished]);
  if (force || a !== sigArch){ sigArch = a; buildArch(); buildFurn(); }
}
function applyLight(){
  sun.position.set(12, 20, 8); sun.target.position.set(0, 0, 0);
  sun.intensity = 2.0; hemi.intensity = 1.1;
  scene.background = new THREE.Color(0xf7f4ee); ground.material.color.set(0xf2eee7);
}
function init(){
  if (inited) return; inited = true;
  renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(SW(), SH());
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  host.appendChild(renderer.domElement);
  labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(SW(), SH());
  Object.assign(labelRenderer.domElement.style, {position:'absolute', inset:'0', pointerEvents:'none'});
  host.appendChild(labelRenderer.domElement);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, SW()/SH(), .05, 300);
  orbit = new OrbitControls(camera, renderer.domElement);
  orbit.enableDamping = true; orbit.maxPolarAngle = Math.PI*.495; orbit.minDistance = 1.5; orbit.maxDistance = 45;
  hemi = new THREE.HemisphereLight(0xfff8ee, 0xb9a88f, 1.1);
  sun = new THREE.DirectionalLight(0xfff1dd, 2.0);
  sun.castShadow = true; sun.shadow.mapSize.setScalar(2048);
  Object.assign(sun.shadow.camera, {left:-11, right:11, top:11, bottom:-11, near:1, far:60});
  ground = new THREE.Mesh(new THREE.PlaneGeometry(160, 160), new THREE.MeshStandardMaterial({color:0xf2eee7, roughness:1}));
  ground.rotation.x = -Math.PI/2; ground.position.y = -0.015; ground.receiveShadow = true;
  scene.add(hemi, sun, sun.target, ground);
  glassMat = new THREE.MeshPhysicalMaterial({color:0xcfe6ef, roughness:.05, transparent:true, opacity:.28, depthWrite:false, side:THREE.DoubleSide});
  wallMat = mat('#f4f1eb', {roughness:.92}); capMat = mat('#34312d', {roughness:.9});
  archFloor = new THREE.Group(); archUp = new THREE.Group(); furnG = new THREE.Group();
  scene.add(archFloor, archUp, furnG);
  new ResizeObserver(() => { renderer.setSize(SW(), SH()); labelRenderer.setSize(SW(), SH()); camera.aspect = SW()/SH(); camera.updateProjectionMatrix(); }).observe(stage);
}
function animateTo(targetPos, targetLook, dur=1200){
  return new Promise(res => {
    const start = performance.now();
    const p0 = camera.position.clone(), t0 = orbit.target.clone();
    const p1 = new THREE.Vector3(...targetPos), t1 = new THREE.Vector3(...targetLook);
    const tick = (now) => {
      const t = Math.min(1, (now-start)/dur), e = t<.5?2*t*t:1-(-2*t+2)**2/2;
      camera.position.lerpVectors(p0, p1, e);
      orbit.target.lerpVectors(t0, t1, e);
      camera.lookAt(orbit.target);
      if (t < 1) anim = requestAnimationFrame(tick); else { anim = null; res(); }
    };
    if (anim) cancelAnimationFrame(anim);
    anim = requestAnimationFrame(tick);
  });
}
async function enter(){
  init(); active = true;
  renderer.setSize(SW(), SH()); labelRenderer.setSize(SW(), SH()); camera.aspect = SW()/SH(); camera.updateProjectionMatrix();
  sync(true);
  const A = [0, 15, 10], B = [0, 0, 0];
  camera.position.set(...A); orbit.target.set(...B);
  stage.classList.add('is3d');
  await new Promise(r => setTimeout(r, 100));
  startLoop();
  await animateTo([0, 8, 8], [0, 0, 0], 1500);
}
async function exit(){
  stage.classList.remove('is3d');
  await new Promise(r => setTimeout(r, 500));
  active = false;
  if (anim) cancelAnimationFrame(anim);
  cancelAnimationFrame(raf); raf = 0;
}
const clock = new THREE.Clock();
function startLoop(){ if (raf) return; clock.getDelta(); raf = requestAnimationFrame(loop); }
function loop(){
  raf = requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05);
  if (orbit) orbit.update();
  doors.forEach(d => { const tg = d.open ? d.a1 : d.a0; d.cur += (tg-d.cur)*Math.min(1, dt*6); d.pivot.rotation.y = d.cur; });
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
window.View3D = { enter, exit, sync: () => sync() };
</script>
